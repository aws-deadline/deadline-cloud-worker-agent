name: macOS E2E Test

# Runs the E2E suite against a macOS worker, on the same CodeBuild path the Linux and
# Windows jobs use. The project is deadline-cloud-worker-agent-mainline-macos-e2e, on a
# MAC_ARM reserved-capacity fleet.
#
# READ THE RESULT IN CLOUDWATCH, NOT HERE. The reusable workflow below passes
# hide-cloudwatch-logs: true and takes no input to override it, so this run shows only pass or
# fail. Which tests failed, and the agent's own logs, are in the CodeBuild project's log. One
# reserved host and concurrency: macose2e mean a re-run to see that log costs a full build.
#
# Dispatch-only, deliberately, though no longer because the host is unproven: a probe build
# confirmed everything the installer needs is permitted here (passwordless sudo, a hidden
# sub-500 account via dscl, dseditgroup GID allocation, an /etc/sudoers.d rule, and a
# LaunchDaemon running as that account). What is still unproven is the suite itself, which has
# never completed a run on this fleet. A dispatch-only workflow cannot turn mainline red or
# block anyone's PR, and it is the only way to exercise the project at all: branch creation is
# blocked on this repository and a fork PR gets no secrets, so `mainline` is the only ref that
# can reach the CodeBuild role.
#
# Once a dispatched run passes, add the push trigger the other two have:
#
#   push:
#     branches:
#       - 'mainline'

on:
  workflow_dispatch:

jobs:
  MainlineMacOSE2ETest:
    name: macOS E2E Test
    permissions:
      id-token: write
      contents: read
    uses: aws-deadline/.github/.github/workflows/reusable_e2e_test.yml@mainline
    secrets: inherit
    with:
      repository: ${{ github.event.repository.name }}
      environment: mainline
      os: macos
    concurrency:
      group: macose2e
