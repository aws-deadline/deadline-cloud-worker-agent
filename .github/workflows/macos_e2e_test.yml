name: macOS E2E Test

# Runs the E2E suite against a macOS worker, on the same CodeBuild path the Linux and
# Windows jobs use. The project is deadline-cloud-worker-agent-mainline-macos-e2e, on a
# MAC_ARM reserved-capacity fleet.
#
# READ THE RESULT IN CLOUDWATCH, NOT HERE. The reusable workflow below passes
# hide-cloudwatch-logs: true and takes no input to override it, so this run shows only pass or
# fail. Which tests failed, and the agent's own logs, are in the CodeBuild project's log. One
# reserved host and concurrency: macose2e mean a re-run to see that log costs a full build.
#
# Kept as its own workflow rather than a third job in mainline_e2e_test.yml so that a
# workflow_dispatch can exercise macOS alone. Folding it in there would make every manual macOS
# run also pay for the Windows suite, which takes over two hours.
#
# One reserved host and concurrency: macose2e mean macOS runs serially. That is not a new
# constraint on mainline, where the Linux and Windows suites already take 1.5 and 2.2 hours, but
# it does mean a push landing while a run is in flight waits rather than running beside it. If
# the fleet's single host is unhealthy this gate fails every mainline push, so treat a macOS-only
# failure as suspect-the-host before suspect-the-commit, and read CloudWatch before reverting.
#
# `mainline` is still the only ref that can reach the CodeBuild role: branch creation is blocked
# on this repository and a fork PR gets no secrets. So workflow_dispatch stays, and it only ever
# does anything useful from mainline.
#
# NOT added to the canaries, unlike Linux and Windows. Those call reusable_canary.yml against
# per-stage CodeBuild projects, and the macOS equivalents do not exist: there is no
# mainline-macos-canary, no release-macos-e2e, and no release-macos-canary. Creating them is a
# CDK change in the infrastructure package, not a change here. Capacity is the bigger reason to
# wait: the canaries run every three hours, so adding macOS to both would ask one reserved host
# for sixteen ~32-minute builds a day on top of the per-merge runs this trigger adds.

on:
  workflow_dispatch:
  push:
    branches:
      - 'mainline'

jobs:
  MainlineMacOSE2ETest:
    name: macOS E2E Test
    permissions:
      id-token: write
      contents: read
    uses: aws-deadline/.github/.github/workflows/reusable_e2e_test.yml@mainline
    secrets: inherit
    with:
      repository: ${{ github.event.repository.name }}
      environment: mainline
      os: macos
    concurrency:
      group: macose2e
