name: Release Canary

on:
  schedule:
    # Default (python) session runtime, every 3 hours.
    - cron: '0 */3 * * *'
    # Rust session runtime, twice a day. The rust jobs share a concurrency
    # group with the python job for the same OS, so the two never run against
    # the test farm at the same time.
    - cron: '30 5,17 * * *'
  workflow_dispatch:

jobs:
  IntegrationTests:
    name: Integration Tests
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Hatch
      run: |
        pip install --upgrade hatch

    - name: Run Integration Tests
      run: hatch run integ-test
      
  ReleaseLinuxE2ECanary:
    name: Release Linux Canary
    if: github.event_name != 'schedule' || github.event.schedule == '0 */3 * * *'
    permissions:
      id-token: write
      contents: read
    uses: aws-deadline/.github/.github/workflows/reusable_canary.yml@mainline
    secrets: inherit
    with:
      repository: ${{ github.event.repository.name }}
      branch: release
      environment: canary
      os: linux
    concurrency:
      group: releaselinuxe2ecanary

  ReleaseWindowsE2ECanary:
    name: Release Windows Canary
    if: github.event_name != 'schedule' || github.event.schedule == '0 */3 * * *'
    permissions:
      id-token: write
      contents: read
    uses: aws-deadline/.github/.github/workflows/reusable_canary.yml@mainline
    secrets: inherit
    with:
      repository: ${{ github.event.repository.name }}
      branch: release
      environment: canary
      os: windows
    concurrency:
      group: releasewindowse2ecanary

  ReleaseLinuxRustE2ECanary:
    name: Release Linux Canary (rust session runtime)
    if: github.event_name != 'schedule' || github.event.schedule == '30 5,17 * * *'
    permissions:
      id-token: write
      contents: read
    uses: aws-deadline/.github/.github/workflows/reusable_canary.yml@mainline
    secrets: inherit
    with:
      repository: ${{ github.event.repository.name }}
      branch: release
      environment: canary
      os: linux
      session_runtime: rust
    concurrency:
      group: releaselinuxe2ecanary

  ReleaseWindowsRustE2ECanary:
    name: Release Windows Canary (rust session runtime)
    if: github.event_name != 'schedule' || github.event.schedule == '30 5,17 * * *'
    permissions:
      id-token: write
      contents: read
    uses: aws-deadline/.github/.github/workflows/reusable_canary.yml@mainline
    secrets: inherit
    with:
      repository: ${{ github.event.repository.name }}
      branch: release
      environment: canary
      os: windows
      session_runtime: rust
    concurrency:
      group: releasewindowse2ecanary
