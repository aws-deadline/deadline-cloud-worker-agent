name: Release Canary

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  IntegrationTests:
    name: Integration Tests
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Hatch
      run: |
        pip install --upgrade hatch 'virtualenv<21; python_version < "3.10"'

    - name: Run Integration Tests
      run: hatch run integ-test
      
  ReleaseLinuxE2ECanary:
    name: Release Linux Canary
    permissions:
      id-token: write
      contents: read
    uses: aws-deadline/.github/.github/workflows/reusable_canary.yml@mainline
    secrets: inherit
    with:
      repository: ${{ github.event.repository.name }}
      branch: release
      environment: canary
      os: linux
    concurrency:
      group: releaselinuxe2ecanary

  ReleaseWindowsE2ECanary:
    name: Release Windows Canary
    permissions:
      id-token: write
      contents: read
    uses: aws-deadline/.github/.github/workflows/reusable_canary.yml@mainline
    secrets: inherit
    with:
      repository: ${{ github.event.repository.name }}
      branch: release
      environment: canary
      os: windows
    concurrency:
      group: releasewindowse2ecanary