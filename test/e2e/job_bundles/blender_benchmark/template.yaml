specificationVersion: jobtemplate-2023-09
name: Blender GPU Benchmark
steps:
  - name: RunBenchmark
    hostRequirements:
      attributes:
        - name: attr.worker.os.family
          allOf:
            - windows
    script:
      actions:
        onRun:
          command: powershell
          args:
            - "-Command"
            - "echo 'Running as:'; whoami; echo '---'; & 'C:\\BlenderBenchmark\\benchmark-launcher-cli.exe' --blender-version 4.5.7 --device-type CUDA --scene monster"
