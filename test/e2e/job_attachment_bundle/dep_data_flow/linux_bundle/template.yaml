- name: Step1-2-34-5
  hostRequirements:
    attributes:
    - name: attr.worker.os.family
      anyOf:
      - linux
  dependencies:
  - dependsOn: Step1-2-3
  - dependsOn: Step1-2-4
  script:
    actions:
      onRun:
        command: '{{Task.File.Fun}}'
    embeddedFiles:
      - name: Fun
        runnable: true
        type: TEXT
        data: |
          #!/bin/env bash

          set -euo pipefail

          # First directory
          export STEP_DIR_1=Step1-2-34-5

          echo "Running $STEP_DIR_1!"

          # DataDir1 should now include the output of Steps 3 and 4, but not Steps 1 or 2.
          echo "Checking DataDir1: {{RawParam.DataDir1}} / {{Param.DataDir1}}"
          if [ "`ls {{Param.DataDir1}} | wc -l`" != "4" ]; then
            echo Starting dir contents is incorrect:
            ls {{Param.DataDir1}}
            exit 1
          fi

          # DataDir2 should now include the output of Steps 3 and 4, but not Steps 1 or 2.
          echo "Checking DataDir2: {{RawParam.DataDir2}} / {{Param.DataDir2}}"
          if [ "`ls {{Param.DataDir2}}/test | wc -l`" != "4" ]; then
            echo Starting dir contents is incorrect:
            ls {{Param.DataDir2}}
            exit 1
          fi

          # InputDir should not include the output of any dependency steps
          echo "Checking InputDir: {{RawParam.InputDir}} / {{Param.InputDir}}"
          if [ "`ls {{Param.InputDir}} | wc -l`" != "2" ]; then
            echo Starting dir contents is incorrect:
            ls {{Param.InputDir}}
            exit 1
          fi

          # This file should be visible when downloading the output job attachments
          cd {{Param.DataDir1}}
          cp Step1-2-3.out $STEP_DIR_1.out
          echo " --- merge --- " >> $STEP_DIR_1.out
          cat Step1-2-4.out >> $STEP_DIR_1.out
          echo "5. Processed in $STEP_DIR_1" >> $STEP_DIR_1.out

          # Second directory
          export STEP_DIR_2=Step2-2-34-5

          echo "Running $STEP_DIR_2!"

          # This file should be visible when downloading the output job attachments
          cd {{Param.DataDir2}}/test
          cp Step2-2-3.out $STEP_DIR_2.out
          echo " --- merge --- " >> $STEP_DIR_2.out
          cat Step2-2-4.out >> $STEP_DIR_2.out
          echo "5. Processed in $STEP_DIR_2" >> $STEP_DIR_2.out

          # This file should not be visible when downloading the output job attachments
          cd {{Param.InputDir}}
          cp create_job_in.txt $STEP_DIR_2.out
          echo "2. Processed in $STEP_DIR_2" >> $STEP_DIR_2.out

          echo Finished $STEP_DIR_1!