specificationVersion: 'jobtemplate-2023-09'
name: '{{Param.JobName}}'
description: |
  This is a test job for step-step dependencies with job attachments data
  flowing along the dependency edges.
parameterDefinitions:
- name: JobName
  type: STRING
  default: Step-Step Dependency Test
- name: DataDir
  type: PATH
  objectType: DIRECTORY
  dataFlow: INOUT
  default: ./data_dir
  description: This directory is both the input and output for all steps.
- name: InputDir
  type: PATH
  objectType: DIRECTORY
  dataFlow: IN
  default: ./input_dir
  description: This directory is only an input for all the steps.
- name: Frames
  type: STRING
  default: "8-11"
steps:
- name: Step1
  hostRequirements:
    attributes:
    - name: attr.worker.os.family
      anyOf:
      - windows
  script:
    actions:
      onRun:
        command: powershell
        args: ["-File", "{{Task.File.step1}}"]
    embeddedFiles:
      - name: step1
        filename: step1.ps1
        runnable: true
        type: TEXT
        data: |
          $STEP="Step1"

          echo "Running $STEP!"

          # The two input job attachments directories should match the files
          # defined in the job bundle.
          echo "Checking DataDir: {{RawParam.DataDir}} / {{Param.DataDir}}"
          if ((Get-ChildItem -Path {{Param.DataDir}}).Count -ne 2) {
            echo "Starting dir contents is incorrect:"
            Get-ChildItem -Path {{Param.DataDir}}
            exit 1
          }
          echo "Checking InputDir: {{RawParam.InputDir}} / {{Param.InputDir}}"
          if ((Get-ChildItem -Path {{Param.InputDir}}).Count -ne 2) {
            echo "Starting dir contents is incorrect:"
            Get-ChildItem -Path {{Param.InputDir}}
            exit 1
          }

          # This file should be visible in later steps
          cd {{Param.DataDir}}
          Copy-Item "create_job_in.txt" -Destination "{{Param.DataDir}}\$STEP.out"
          echo "2. Processed in $STEP" | Out-File -FilePath "$STEP.out" -Append -Encoding utf8

          # This file should not be visible in later steps
          cd {{Param.InputDir}}
          Copy-Item "create_job_in.txt" -Destination "{{Param.InputDir}}\$STEP.out"
          echo "2. Processed in $STEP" | Out-File -FilePath "$STEP.out" -Append -Encoding utf8

          echo "Finished $STEP!"
- name: Step1-2
  hostRequirements:
    attributes:
    - name: attr.worker.os.family
      anyOf:
      - windows
  dependencies:
  - dependsOn: Step1
  parameterSpace:
    taskParameterDefinitions:
    - name: Frame
      type: INT
      range: "{{Param.Frames}}"
  script:
    actions:
      onRun:
        command: powershell
        args: ["-File", "{{Task.File.step2}}"]
    embeddedFiles:
      - name: step2
        filename: step2.ps1
        runnable: true
        type: TEXT
        data: |
          $STEP="Step1-2.{{Task.Param.Frame}}"

          echo "Running $STEP!"

          # DataDir should now include the output of Step1.
          echo "Checking DataDir: {{RawParam.DataDir}} / {{Param.DataDir}}"
          # When running all the tasks of a step, the output is not cleared
          # between each task, so outputs from other tasks may be included.
          $DATA_DIR_COUNT=(Get-ChildItem -Path {{Param.DataDir}}).Count
          if (($DATA_DIR_COUNT -lt 3) -or ($DATA_DIR_COUNT -gt 6)) {
            echo Starting dir contents is incorrect:
            ls {{Param.DataDir}}
            exit 1
          }
          # InputDir should not include the output of Step1
          echo "Checking InputDir: {{RawParam.InputDir}} / {{Param.InputDir}}"
          # When running all the tasks of a step, the input is not cleared
          # between each task, so inputs created from other tasks may be included.
          $INPUT_DIR_COUNT=(Get-ChildItem -Path {{Param.InputDir}}).Count
          if (($INPUT_DIR_COUNT -lt 2) -or ($INPUT_DIR_COUNT -gt 5)) {
            echo Starting dir contents is incorrect:
            ls {{Param.InputDir}}
            exit 1
          }

          # This file should be visible in later steps
          cd {{Param.DataDir}}
          Copy-Item "Step1.out" -Destination "{{Param.DataDir}}\$STEP.out"
          echo "3.{{Task.Param.Frame}} Processed in $STEP" | Out-File -FilePath "$STEP.out" -Append -Encoding utf8

          # This file should not be visible in later steps
          cd {{Param.InputDir}}
          Copy-Item "create_job_in.txt" -Destination "{{Param.InputDir}}\$STEP.out"
          echo "2. Processed in $STEP" | Out-File -FilePath "$STEP.out" -Append -Encoding utf8

          echo "Finished $STEP!"
- name: Step1-2-3
  hostRequirements:
    attributes:
    - name: attr.worker.os.family
      anyOf:
      - windows
  dependencies:
  - dependsOn: Step1-2
  script:
    actions:
      onRun:
        command: powershell
        args: ["-File", "{{Task.File.step3}}"]
    embeddedFiles:
      - name: step3
        filename: step3.ps1
        runnable: true
        type: TEXT
        data: |
          $STEP="Step1-2-3"

          echo "Running $STEP!"

          # DataDir should now include the output of every task in Step2, but not Step1.
          echo "Checking DataDir: {{RawParam.DataDir}} / {{Param.DataDir}}"
          if ((Get-ChildItem -Path {{Param.DataDir}}).Count -ne 6) {
            echo "Starting dir contents is incorrect:"
            Get-ChildItem -Path {{Param.DataDir}}
            exit 1
          }
          # InputDir should not include the output of Step1 or Step2
          echo "Checking InputDir: {{RawParam.InputDir}} / {{Param.InputDir}}"
          if ((Get-ChildItem -Path {{Param.InputDir}}).Count -ne 2) {
            echo "Starting dir contents is incorrect:"
            Get-ChildItem -Path {{Param.InputDir}}
            exit 1
          }

          # This file should be visible in later steps
          cd {{Param.DataDir}}
          Copy-Item "Step1-2.8.out" -Destination "{{Param.DataDir}}\$STEP.out"
          Get-Content Step1-2.9.out | Out-File -FilePath "$STEP.out" -Append -Encoding utf8
          Get-Content Step1-2.10.out | Out-File -FilePath "$STEP.out" -Append -Encoding utf8
          Get-Content Step1-2.11.out | Out-File -FilePath "$STEP.out" -Append -Encoding utf8
          echo "4. Processed in $STEP" | Out-File -FilePath "$STEP.out" -Append -Encoding utf8

          # This file should not be visible in later steps
          cd {{Param.InputDir}}
          Copy-Item "create_job_in.txt" -Destination "{{Param.InputDir}}\$STEP.out"
          echo "2. Processed in $STEP" | Out-File -FilePath "$STEP.out" -Append -Encoding utf8

          echo "Finished $STEP!"
- name: Step1-2-4
  hostRequirements:
    attributes:
    - name: attr.worker.os.family
      anyOf:
      - windows
  dependencies:
  - dependsOn: Step1-2
  script:
    actions:
      onRun:
        command: powershell
        args: ["-File", "{{Task.File.step4}}"]
    embeddedFiles:
      - name: step4
        filename: step4.ps1
        runnable: true
        type: TEXT
        data: |
          $STEP="Step1-2-4"

          echo "Running $STEP!"

          # DataDir should now include the output of every task in Step2, but not Step1.
          echo "Checking DataDir: {{RawParam.DataDir}} / {{Param.DataDir}}"
          if ((Get-ChildItem -Path {{Param.DataDir}}).Count -ne 6) {
            echo "Starting dir contents is incorrect:"
            Get-ChildItem -Path {{Param.DataDir}}
            exit 1
          }
          # InputDir should not include the output of Step1 or Step2
          echo "Checking InputDir: {{RawParam.InputDir}} / {{Param.InputDir}}"
          if ((Get-ChildItem -Path {{Param.InputDir}}).Count -ne 2) {
            echo "Starting dir contents is incorrect:"
            Get-ChildItem -Path {{Param.InputDir}}
            exit 1
          }

          # This file should be visible in later steps
          cd {{Param.DataDir}}
          Copy-Item "Step1-2.8.out" -Destination "{{Param.DataDir}}\$STEP.out"
          Get-Content Step1-2.9.out | Out-File -FilePath "$STEP.out" -Append -Encoding utf8
          Get-Content Step1-2.10.out | Out-File -FilePath "$STEP.out" -Append -Encoding utf8
          Get-Content Step1-2.11.out | Out-File -FilePath "$STEP.out" -Append -Encoding utf8
          echo "4. Processed in $STEP" | Out-File -FilePath "$STEP.out" -Append -Encoding utf8

          # This file should not be visible in later steps
          cd {{Param.InputDir}}
          Copy-Item "create_job_in.txt" -Destination "{{Param.InputDir}}\$STEP.out"
          echo "2. Processed in $STEP" | Out-File -FilePath "$STEP.out" -Append -Encoding utf8

          echo "Finished $STEP!"
- name: Step1-2-34-5
  hostRequirements:
    attributes:
    - name: attr.worker.os.family
      anyOf:
      - windows
  dependencies:
  - dependsOn: Step1-2-3
  - dependsOn: Step1-2-4
  script:
    actions:
      onRun:
        command: powershell
        args: ["-File", "{{Task.File.step5}}"]
    embeddedFiles:
      - name: step5
        filename: step5.ps1
        runnable: true
        type: TEXT
        data: |
          $STEP="Step1-2-34-5"

          echo "Running $STEP!"

          # DataDir should now include the output of Steps 3 and 4, but not Steps 1 or 2.
          echo "Checking DataDir: {{RawParam.DataDir}} / {{Param.DataDir}}"
          if ((Get-ChildItem -Path {{Param.DataDir}}).Count -ne 4) {
            echo "Starting dir contents is incorrect:"
            Get-ChildItem -Path {{Param.DataDir}}
            exit 1
          }
          # InputDir should not include the output of any dependency steps
          echo "Checking InputDir: {{RawParam.InputDir}} / {{Param.InputDir}}"
          if ((Get-ChildItem -Path {{Param.InputDir}}).Count -ne 2) {
            echo "Starting dir contents is incorrect:"
            Get-ChildItem -Path {{Param.InputDir}}
            exit 1
          }

          # This file should be visible when downloading the output job attachments
          cd {{Param.DataDir}}
          Copy-Item "Step1-2-3.out" -Destination "{{Param.DataDir}}\$STEP.out"
          echo " --- merge --- " | Out-File -FilePath "$STEP.out" -Append -Encoding utf8
          Get-Content Step1-2-4.out | Out-File -FilePath "$STEP.out" -Append -Encoding utf8
          echo "5. Processed in $STEP" | Out-File -FilePath "$STEP.out" -Append -Encoding utf8

          # This file should not be visible when downloading the output job attachments
          cd {{Param.InputDir}}
          Copy-Item "create_job_in.txt" -Destination "{{Param.InputDir}}\$STEP.out"
          echo "2. Processed in $STEP" | Out-File -FilePath "$STEP.out" -Append -Encoding utf8

          echo "Finished $STEP!"